[workspace]
resolver = "2"
members = [
    "crates/lutra-proto",
    "crates/lutrad",
    "crates/lutra-mcpd",
    "crates/lutra-audit",
    "crates/ltr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lutra OS"]

[workspace.dependencies]
lutra-proto = { path = "crates/lutra-proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[profile.release]
strip = true
lto = "thin"
