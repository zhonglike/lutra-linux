# Lutra 构建机无人值守安装配置（Debian trixie amd64）
# 用途：为内核与镜像构建提供干净、可复现的 Linux 环境

# ---------- 语言与时区 ----------
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i keyboard-configuration/xkb-keymap select us

# ---------- 跳过 CD 检测（通过 -kernel 直接引导安装器） ----------
d-i cdrom-detect/load_media boolean false

# ---------- 网络 ----------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string lutra-build
d-i netcfg/get_domain string local

# ---------- 软件源 ----------
# 说明：仅「构建 VM 的装机阶段」使用国内镜像，避免 apt update 长时间停滞。
#       最终发行版的 sources.list 与构建脚本仍使用 Debian 官方源。
d-i mirror/country string manual
d-i mirror/http/hostname string mirrors.tuna.tsinghua.edu.cn
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i apt-setup/security_host string mirrors.tuna.tsinghua.edu.cn
d-i apt-setup/security_path string /debian-security

# 使用 DVD-1 本地源，不配置网络镜像（装机全程不联网）
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# ---------- 账户 ----------
d-i passwd/root-login boolean false
d-i passwd/user-fullname string lutra
d-i passwd/username string lutra
d-i passwd/user-password password lutra
d-i passwd/user-password-again password lutra

# ---------- 时钟 ----------
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

# ---------- 分区：整盘单一根分区 + swap ----------
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ---------- 软件包（全部来自 DVD，不联网） ----------
d-i pkgsel/include string openssh-server build-essential git ccache btrfs-progs \
  curl wget vim rsync bc flex bison libssl-dev libelf-dev dkms
d-i pkgsel/ignore-error boolean true
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
d-i pkgsel/install-language-support boolean false
popularity-contest popularity-contest/participate boolean false

# ---------- 引导 ----------
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# ---------- 收尾 ----------
d-i finish-install/reboot_in_progress note
